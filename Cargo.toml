[package]
name = "zhli"
version = "0.2.0"
edition = "2021"
description = "ZHLI — Command Line Chinese Trainer with spaced repetition"
authors = ["Radley E. Sidwell-Lewis"]
license = "GPL-3.0-only"

[[bin]]
name = "zhli"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
anyhow = "1"
dirs = "5"
rand = "0.8"
unicode-width = "0.1"
arboard = "3"
open = "5"
ureq = "2"
scraper = "0.21"
